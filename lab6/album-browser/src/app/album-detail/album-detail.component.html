<div *ngIf="album">
  <h2>Album Detail</h2>
  <p><strong>ID:</strong> {{album.id}}</p>
  <p><strong>User ID:</strong> {{album.userId}}</p>

  <div>
    <label>Title: </label>
    <input [(ngModel)]="album.title">
    <button (click)="save()">Save</button> </div>

  <br>
  <button [routerLink]="['/albums', album.id, 'photos']">View Photos</button> <button routerLink="/albums">Back</button> </div>
