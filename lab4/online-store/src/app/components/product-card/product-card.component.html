<div class="card">
  <div class="image-container">
    <img [src]="product.image" [alt]="product.name" class="main-photo">
  </div>

  <div class="gallery">
    <img *ngFor="let img of product.images"
         [src]="img"
         (click)="product.image = img"
         class="thumb">
  </div>

  <div class="card-content">
    <h3>{{ product.name }}</h3>
    <p class="description">{{ product.description }}</p>

    <div class="price">{{ product.price | number }} ₸</div>

    <div class="rating">
      <span class="stars">★★★★★</span>
      <span class="rating-value">{{ product.rating }}</span>
    </div>

    <div class="actions">
      <a [href]="product.link" target="_blank" class="btn-kaspi">Купить на Kaspi</a>
      <div class="share-buttons">
        <button (click)="shareToWhatsApp()" class="btn-share wa">WA</button>
        <button (click)="shareToTelegram()" class="btn-share tg">TG</button>
      </div>
    </div>
  </div>
</div>
