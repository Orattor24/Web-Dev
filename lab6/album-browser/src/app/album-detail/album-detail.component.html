<div *ngIf="album">
  <h2>Album Details</h2>
  <p><strong>ID:</strong> {{album.id}}</p>
  <p><strong>User ID:</strong> {{album.userId}}</p>

  <div>
    <label>Title: </label>
    <input [(ngModel)]="album.title" placeholder="Edit title">
  </div>

  <button (click)="save()">Save Changes</button> <hr>
  <button [routerLink]="['/albums', album.id, 'photos']">View Photos</button>
  <button routerLink="/albums">Back to List</button>
</div>
